# Phase 1 configuration
# "Zero-Shot, Few-Shot, or Retrieval-Augmented? Prompting Strategies for ICD-10 Coding with Open-Weight LLMs"

seed: 42

# --- Vocabulary ---
vocab:
  fiscal_year: "2024"
  source_url: "https://www.cdc.gov/nchs/icd/icd-10-cm/files.html"
  raw_dir: "data/raw"
  vocab_path: "data/vocab/icd10cm_2024.jsonl"

# --- Models ---
models:
  llama3:
    model_id: "meta-llama/Meta-Llama-3-8B-Instruct"
    context_limit: 8192
    quantisation: "nf4"
    bnb_4bit_compute_dtype: "float16"
    bnb_4bit_use_double_quant: true
    bnb_4bit_quant_type: "nf4"
    stop_tokens: ["<|eot_id|>"]
    template_mode: "system"  # LLaMA-3 supports system role
    # Llama-3 chat template already emits <|begin_of_text|>; default tokenisation would add
    # a second BOS (verified on the cached Llama-3.1-8B-Instruct tokenizer, same template family).
    tokenize_special_tokens: false
  # Experiment layer: experiments/llama3/ (see its README). Same shared pipeline as
  # the other entries; only the backend model differs. Added as a new key so no
  # existing entry changes. Not the paper's 8B model: see experiments/llama3/README.md.
  llama3.2-3b:
    backend: "hf"
    model_id: "unsloth/Llama-3.2-3B-Instruct-bnb-4bit"  # pre-quantised bnb-4bit checkpoint, public
    context_limit: 8192   # matched to the paper's LLaMA-3 arm (checked against real prompt lengths in the smoke run)
    quantisation: "nf4"   # checkpoint is already NF4 (bnb); see README for the loading caveat
    bnb_4bit_compute_dtype: "float16"
    bnb_4bit_use_double_quant: true
    bnb_4bit_quant_type: "nf4"
    stop_tokens: ["<|eot_id|>"]
    template_mode: "system"
    tokenize_special_tokens: false  # Llama-3 chat template already emits <|begin_of_text|>
  biomistral:
    model_id: "BioMistral/BioMistral-7B"
    context_limit: 2048
    quantisation: "nf4"
    bnb_4bit_compute_dtype: "float16"
    bnb_4bit_use_double_quant: true
    bnb_4bit_quant_type: "nf4"
    stop_tokens: []
    template_mode: "prepend"  # Mistral rejects system role
  gemini-1.5-flash:
    backend: "gemini"
    model_id: "gemini-3.8-flash"
    context_limit: 1048576
    template_mode: "system"
  gemini-3.8-flash:
    backend: "gemini"
    model_id: "gemini-3.8-flash"
    context_limit: 1048576
    template_mode: "system"
  gemini-flash:
    backend: "gemini"
    model_id: "gemini-flash-latest"
    context_limit: 1048576
    template_mode: "system"
  gemini-flash-lite:
    backend: "gemini"
    model_id: "gemini-flash-lite-latest"
    context_limit: 1048576
    template_mode: "system"
  gemini-pro:
    backend: "gemini"
    model_id: "gemini-pro-latest"
    context_limit: 2097152
    template_mode: "system"
  gpt-4o-mini:
    backend: "openai"
    model_id: "gpt-4o-mini"
    context_limit: 128000
    template_mode: "system"
  gpt-4o:
    backend: "openai"
    model_id: "gpt-4o"
    context_limit: 128000
    template_mode: "system"
  claude-3-5-sonnet:
    backend: "anthropic"
    model_id: "claude-3-5-sonnet-20241022"
    context_limit: 200000
    template_mode: "system"
  qwen2.5-7b:
    backend: "hf"
    model_id: "Qwen/Qwen2.5-7B-Instruct"
    context_limit: 32768
    quantisation: "nf4"
    bnb_4bit_compute_dtype: "float16"
    bnb_4bit_use_double_quant: true
    bnb_4bit_quant_type: "nf4"
    stop_tokens: ["<|im_end|>"]
    template_mode: "system"

# --- Strategies ---
strategies:
  zero_shot:
    type: "zero_shot"
  few_shot:
    type: "few_shot"
    k: 5
    min_implicit: 2  # at least 2 shots with implicit codes
  rag:
    type: "rag"
    k: 20             # top-k retrieval candidates
    per_query_m: 30   # per-query top-m before merge
  kg:
    # HYBRID: semantic seeds (same index as rag) + official ICD-10-CM hierarchy expansion.
    type: "kg"
    k: 20             # candidate pool size, same as rag, so only the candidate set differs
    seed_k: 10        # top semantic seeds that get expanded
    max_children: 5   # direct children taken per seed (XML order); parent always added

# --- Decoding ---
decoding:
  do_sample: false
  max_new_tokens: 256
  batch_size: 1

# --- Knowledge graph (official ICD-10-CM 2024 tabular hierarchy) ---
# Build with: python src/kg.py build --zip data/raw/icd10cm-Table-and-Index-2024.zip
#             --xml data/raw/icd10cm_tabular_2024.xml --out data/kg/icd10cm_2024_hierarchy.jsonl
kg:
  hierarchy_path: "data/kg/icd10cm_2024_hierarchy.jsonl"

# --- Retrieval ---
retrieval:
  embedder: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_format: "{code}: {long_desc}"
  index_dir: "data/index"
  note_window_words: 150
  note_window_overlap: 30

# --- Data ---
data:
  synthetic_dir: "data/synthetic"
  n_eval: 200
  n_fewshot_pool: 50
  n_dev: 30
  implicit_rate: 0.45
  max_words: 200
  conditions_per_record_min: 3
  conditions_per_record_max: 6
  distractors_per_record_min: 1
  distractors_per_record_max: 3

# --- Overflow ---
overflow_policy: "truncate_record"
section_priority:
  - "Discharge Diagnosis"
  - "Brief Hospital Course"
  - "Chief Complaint"
  - "History of Present Illness"
  - "Past Medical History"

# --- Output ---
results_dir: "results"
results_mock_dir: "results_mock"
reports_dir: "reports"

